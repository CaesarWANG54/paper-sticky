name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag matching the app version, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: '纸间便签 ${{ inputs.tag }}'
          releaseBody: 'Windows x64 安装版。功能与使用方法见仓库 README。'
          releaseDraft: true
